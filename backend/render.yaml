services:
  - type: web
    name: streambox-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && node server.js
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CAMPAY_MODE
        sync: false
      - key: CAMPAY_APP_USERNAME
        sync: false
      - key: CAMPAY_APP_PASSWORD
        sync: false
      - key: CAMPAY_ENVIRONMENT
        sync: false
      - key: SYNC_CRON
        value: "0 3 * * *"
      - key: SYNC_TIMEZONE
        value: "Africa/Douala"
      - key: EXPIRY_CRON
        value: "0 * * * *"
    autoDeploy: true