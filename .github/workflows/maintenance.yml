name: StreamBox API maintenance

# Render's free web services sleep after ~15 minutes of inactivity, which
# stops the in-process node-cron jobs (daily catalog sync + hourly premium
# expiry) from firing. This repo-native workflow keeps the API awake and can
# trigger the cron jobs explicitly, with no third-party account required.
#
# NOTE: GitHub disables scheduled workflows after 60 days without repository
# activity — run this workflow manually once to re-enable it if needed.
# Scheduled runs are coalesced/delayed under load, so treat this as best-effort.

on:
  schedule:
    - cron: "*/10 * * * *" # keep-alive
    - cron: "0 2 * * *" # 03:00 Africa/Douala (UTC+1)
  workflow_dispatch: {}

concurrency:
  group: streambox-maintenance
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event.schedule != '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          # cold starts on the free tier can take 30-60s, so allow up to 90s
          curl -sS --max-time 90 -o /dev/null -w "health -> HTTP %{http_code} in %{time_total}s\n" \
            https://streambox-9yvi.onrender.com/health || echo "ping failed (instance cold-starting or unreachable)"

  daily-maintenance:
    if: github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger catalog sync + premium expiry
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET GitHub secret not set — skipping (keep-alive still runs)."
            exit 0
          fi
          curl -sS --max-time 120 -X POST \
            "https://streambox-9yvi.onrender.com/api/cron/run?job=all" \
            -H "x-cron-secret: $CRON_SECRET" \
            -w "\ncron -> HTTP %{http_code}\n"
